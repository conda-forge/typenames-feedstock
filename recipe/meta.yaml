{% set name = "typenames" %}
{% set version = "2.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/typenames-{{ version }}.tar.gz
  sha256: 7d64e8432e7ed0cb583afd1b6d44bcb3c8d55d0b76f69e5f58c1a251131aa42a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - typenames
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: String representations of Python type annotations.
  license: MIT
  license_file: LICENSE
  home: https://github.com/drivendataorg/typenames
  dev_url: https://github.com/drivendataorg/typenames
  doc_url: https://typenames.drivendata.org/stable/

extra:
  recipe-maintainers:
    - jayqi
